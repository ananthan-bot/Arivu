name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: ankane/pgvector:v0.5.1
        env:
          POSTGRES_USER: arivu
          POSTGRES_PASSWORD: arivu
          POSTGRES_DB: arivu
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U arivu"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Lint (ruff)
        working-directory: backend
        run: |
          pip install ruff
          ruff check app tests

      - name: Run tests
        working-directory: backend
        env:
          DATABASE_URL: postgresql://arivu:arivu@localhost:5432/arivu
        run: pytest tests/ -v
